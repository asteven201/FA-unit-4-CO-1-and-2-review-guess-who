<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guess Who? Algebra Two Player</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#243047;background:#f2f5fb}*{box-sizing:border-box}body{margin:0}main{max-width:1040px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;color:#2354a3}button,select{font:inherit}button{cursor:pointer;border:1px solid #b9c6dc;border-radius:9px;padding:10px;background:white;font-weight:700;color:#243047}button:hover{filter:brightness(.96)}.primary{background:#2354a3;color:white;border-color:#2354a3}.panel{background:white;border:1px solid #d6deeb;border-radius:15px;padding:16px;margin-top:14px;box-shadow:0 3px 12px #2233550b}.center{text-align:center}.turn{background:#ffe3a3;border-radius:10px;padding:12px;text-align:center;font-weight:800}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;background:#a66c37;border:9px solid #75451e;border-radius:15px;padding:10px}.face{min-width:0;background:#f9e2aa;border:3px solid #d7b26a;border-bottom:7px solid #a87539;padding:4px 2px;color:#49301e;position:relative}.face svg{display:block;width:100%;height:94px}.face strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.face.down{opacity:.32;transform:scale(.94)}.face.down:after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;color:#b82222;font-size:46px;font-weight:900}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid2 button{text-align:left}.muted{color:#59677b;font-size:13px}.big{font-size:22px;font-weight:800}.hidden{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1}.status{padding:10px;background:#e9f0ff;border-radius:9px;margin:10px 0}.secret{font-size:34px;font-weight:900;padding:16px;background:#eaf1ff;border-radius:10px}.question{font-size:21px;font-weight:750;margin:16px 0}.feedback{font-size:18px;font-weight:750}.scroll{max-height:150px;overflow:auto}select{width:100%;padding:12px;border-radius:9px;border:1px solid #b9c6dc}button:focus-visible{outline:3px solid #e28a13}@media(max-width:600px){.board{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:6px;border-width:5px}.face svg{height:75px}.face strong{font-size:10px}.grid2{grid-template-columns:1fr}}
</style></head><body><main><header><div><h1>GUESS WHO? 🎭</h1><div class="muted">Algebra Unit 4 · CO 1 &amp; CO 2 · Two-player pass-and-play</div></div><button id="reset">New Game ↻</button></header><div id="app" aria-live="polite"></div></main><script>
(()=>{'use strict';const app=document.getElementById('app');const names=['Alex','Bailey','Casey','Drew','Emery','Finley','Gray','Harper','Indigo','Jordan','Kai','Logan','Morgan','Nico','Oakley','Parker','Quinn','Reese','Sage','Taylor','Uma','Val','Winter','Zion'];const hair=['brown','blonde','black','red'];const people=names.map((name,i)=>({name,hair:hair[i%4],glasses:Math.floor(i/4)%2===1,hat:Math.floor(i/8)%2===1,long:i%3===0,shirt:['#427ec6','#e27e65','#4aa38a','#a078c9'][(i*3+Math.floor(i/4))%4]}));const qs=[
['For y = 2x + 3, what is the slope?',['2','3','−2','1/2'],0,1],['For y = −(2/3)x − 4, what is the y-intercept?',['−2/3','4','−4','2/3'],2,1],['For y = −2x − 5, what is the slope?',['−5','−2','2','5'],1,1],['For y = 4x + 6, where does the line cross the y-axis?',['(4,0)','(0,4)','(6,0)','(0,6)'],3,1],['For y = 3x − 2, which point lies on the line?',['(1,1)','(1,2)','(0,3)','(2,2)'],0,1],['For y = −x + 4, what is y when x = 2?',['6','−2','2','4'],2,1],['Which second point can you plot from (0,1) using slope 3/2?',['(3,2)','(2,−2)','(2,4)','(3,3)'],2,1],['For y = −3x + 2, which point lies on the line?',['(1,−1)','(1,1)','(−1,−1)','(0,−3)'],0,1],
['A line has slope 4/3 and passes through (−3,1). Which equation is correct?',['y = (4/3)x + 5','y = (4/3)x − 3','y = 4x + 3','y = (3/4)x + 5'],0,2],['Find the equation through (2,7) and (5,−2).',['y = 3x + 1','y = −3x + 13','y = −3x + 7','y = 3x − 13'],1,2],['Slope 2, through (1,5): which equation?',['y = 2x + 5','y = 2x − 3','y = 2x + 3','y = x + 4'],2,2],['Slope −1/2, y-intercept 6: which equation?',['y = 6x − 1/2','y = (1/2)x + 6','y = −6x + 1/2','y = −(1/2)x + 6'],3,2],['Through (0,−3) and (2,1), find the equation.',['y = 2x − 3','y = −2x − 3','y = 2x + 3','y = x − 3'],0,2],['Through (−1,4) with slope −2: find the equation.',['y = −2x + 4','y = −2x + 2','y = 2x + 6','y = −2x − 2'],1,2],['A line through (3,8) has slope 2. Find b in y = 2x + b.',['−2','8','6','2'],3,2],['Through (1,2) and (3,6), find the equation.',['y = x + 1','y = 2x','y = 3x − 1','y = −2x + 4'],1,2]];
let s;const rand=n=>Math.floor(Math.random()*n);function newGame(){s={stage:'intro',p:0,secrets:[null,null],down:[new Set(),new Set()],used:[],q:null,move:null,correct:false,round:1,log:[],winner:null,clue:''};render()}
function portrait(p){const hc={brown:'#764523',blonde:'#e8bc48',black:'#292a36',red:'#b74b2a'}[p.hair];return `<svg viewBox="0 0 90 95" aria-hidden="true"><rect x="10" y="74" width="70" height="24" rx="13" fill="${p.shirt}"/><rect x="37" y="65" width="16" height="15" fill="#dba87d"/><ellipse cx="45" cy="43" rx="27" ry="31" fill="#e9b88c"/><path d="${p.long?'M17 67 Q5 10 45 9 Q85 10 73 67 L66 57 L66 26 Q45 15 24 29 L24 57Z':'M18 39 Q12 8 45 10 Q78 8 72 39 L65 27 Q42 14 24 32Z'}" fill="${hc}"/><circle cx="35" cy="45" r="3" fill="#302c2a"/><circle cx="55" cy="45" r="3" fill="#302c2a"/><path d="M36 57 Q45 65 54 57" stroke="#9b5149" stroke-width="2" fill="none"/>${p.glasses?'<g fill="none" stroke="#263d50" stroke-width="3"><rect x="25" y="37" width="18" height="17" rx="6"/><rect x="47" y="37" width="18" height="17" rx="6"/><path d="M43 43H47"/></g>':''}${p.hat?'<path d="M15 27 Q17 2 45 3 Q73 2 75 27 L84 29 Q45 39 7 29Z" fill="#3b5a91"/>':''}</svg>`}
function board(select=false){return `<div class="board">${people.map((person,i)=>`<button class="face ${!select&&s.down[s.p].has(i)?'down':''}" data-${select?'pick':'flip'}="${i}" aria-label="${person.name}">${portrait(person)}<strong>${person.name}</strong></button>`).join('')}</div>`}
function panel(x){return `<section class="panel">${x}</section>`}function chooseQuestion(){let avail=qs.map((_,i)=>i).filter(i=>!s.used.includes(i));if(!avail.length){s.used=[];avail=qs.map((_,i)=>i)}let i=avail[rand(avail.length)];s.used.push(i);s.q=qs[i];s.stage='question'}function endTurn(){s.p=1-s.p;s.round++;s.stage='pass';s.q=null;s.move=null;render()}
function render(){let html='';if(s.stage==='intro')html=panel(`<h2>How to play</h2><p>Each player secretly chooses one of 24 characters. Take turns answering an Algebra question to unlock a yes/no clue or make a final guess. Flip down characters that don't match. First correct guess wins!</p><p class="muted">One device: pass it between players and don't peek at the other player's secret.</p><button class="primary" data-act="start">Choose Player 1's character</button>`);
else if(s.stage==='pick')html=panel(`<div class="turn">Player ${s.p+1}: choose your secret character</div><p>Make your selection privately. The other player should look away.</p>${board(true)}`);
else if(s.stage==='reveal'){let c=people[s.secrets[s.p]];html=panel(`<div class="center"><h2>Player ${s.p+1}'s secret</h2><div class="secret">${c.name}</div><p>${c.hair} hair · ${c.glasses?'glasses':'no glasses'} · ${c.hat?'hat':'no hat'} · ${c.long?'long hair':'short hair'}</p><p class="muted">Memorize your character. Hide the screen before passing it.</p><button class="primary" data-act="hide">Hide secret and continue</button></div>`)}
else if(s.stage==='pass')html=panel(`<div class="center"><div class="big">🔒 Pass the device to Player ${s.p+1}</div><p>Only Player ${s.p+1} should tap Ready.</p><button class="primary" data-act="ready">I'm Player ${s.p+1} — Ready</button></div>`);
else if(s.stage==='won')html=panel(`<div class="center"><div style="font-size:55px">🏆</div><h2>Player ${s.winner+1} wins!</h2><p>The mystery character was <strong>${people[s.secrets[1-s.winner]].name}</strong>.</p><button class="primary" data-act="restart">Play again</button></div>`);
else{html=`<div class="panel"><div class="turn">Player ${s.p+1}'s turn · Round ${s.round}</div><p class="muted">${24-s.down[s.p].size} faces remaining. Tap a card to flip it down or restore it.</p>${board()}</div>`;
if(s.stage==='turn')html+=panel(`<h2>Choose your move</h2><div class="actions"><button class="primary" data-act="ask">Answer question → Ask a clue</button><button data-act="guess">Answer question → Final guess</button><button data-act="end">Skip turn</button></div>`);
if(s.stage==='question')html+=panel(`<div class="muted">CO ${s.q[3]} · ${s.move==='guess'?'FINAL GUESS':'CLUE'} CHALLENGE</div><div class="question">${s.q[0]}</div><div class="grid2">${s.q[1].map((a,i)=>`<button data-answer="${i}">${'ABCD'[i]}. ${a}</button>`).join('')}</div>`);
if(s.stage==='result')html+=panel(`<div class="feedback">${s.correct?'✓ Correct!':'✗ Not quite!'}</div><p>${s.correct?'Your move is unlocked.':'Correct answer: '+s.q[1][s.q[2]]+'. Your turn ends.'}</p><button class="primary" data-act="${s.correct?'proceed':'end'}">${s.correct?'Continue':'Pass turn'}</button>`);
if(s.stage==='clue')html+=panel(`<h2>Ask a yes/no question</h2><p>Read your question aloud. Your opponent answers truthfully without revealing their character.</p><div class="grid2">${['Does your person wear glasses?','Does your person wear a hat?','Does your person have long hair?','Does your person have brown hair?','Does your person have blonde hair?','Does your person have black hair?','Does your person have red hair?'].map((x,i)=>`<button data-clue="${i}">${x}</button>`).join('')}</div>`);
if(s.stage==='answer')html+=panel(`<h2>${s.clue}</h2><p>Opponent answers <strong>Yes</strong> or <strong>No</strong> aloud. Flip down eliminated faces on your board above.</p><button class="primary" data-act="end">Done — Pass turn</button>`);
if(s.stage==='guess')html+=panel(`<h2>Final guess</h2><p>Who is your opponent's secret character?</p><select id="choice">${people.map((v,i)=>!s.down[s.p].has(i)?`<option value="${i}">${v.name}</option>`:'').join('')}</select><p><button class="primary" data-act="submit">Submit guess</button></p>`);
if(s.stage==='wrong')html+=panel(`<h2>Not that character!</h2><p>Your guess was incorrect. Your turn ends.</p><button class="primary" data-act="end">Pass turn</button>`);
html+=panel(`<div class="actions"><button data-act="restore">Restore all faces</button><button data-act="mine">View my secret character</button></div>${s.log.length?`<p class="muted scroll">${s.log.slice(-5).map(x=>`• ${x}`).join('<br>')}</p>`:''}`)}app.innerHTML=html}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.pick!==undefined&&s.stage==='pick'){s.secrets[s.p]=Number(b.dataset.pick);s.stage='reveal';render();return}if(b.dataset.flip!==undefined&&['turn','question','result','clue','answer','guess','wrong'].includes(s.stage)){const i=Number(b.dataset.flip),set=s.down[s.p];set.has(i)?set.delete(i):set.add(i);render();return}if(b.dataset.answer!==undefined&&s.stage==='question'){s.correct=Number(b.dataset.answer)===s.q[2];s.stage='result';render();return}if(b.dataset.clue!==undefined&&s.stage==='clue'){const prompts=['Does your person wear glasses?','Does your person wear a hat?','Does your person have long hair?','Does your person have brown hair?','Does your person have blonde hair?','Does your person have black hair?','Does your person have red hair?'];s.clue=prompts[Number(b.dataset.clue)];s.log.push(`Player ${s.p+1} asked: ${s.clue}`);s.stage='answer';render();return}switch(b.dataset.act){case 'start':s.stage='pick';break;case 'hide':if(s.secrets[1]===null){s.p=1;s.stage='pass'}else{s.p=0;s.stage='pass'}break;case 'ready':s.stage=s.secrets[s.p]===null?'pick':'turn';break;case 'ask':s.move='ask';chooseQuestion();break;case 'guess':s.move='guess';chooseQuestion();break;case 'proceed':s.stage=s.move==='guess'?'guess':'clue';break;case 'end':endTurn();return;case 'submit':{let i=Number(document.getElementById('choice').value);if(i===s.secrets[1-s.p]){s.winner=s.p;s.stage='won'}else{s.log.push(`Player ${s.p+1} guessed ${people[i].name} incorrectly`);s.stage='wrong'}break}case 'restore':s.down[s.p].clear();break;case 'mine':s.stage='reveal';break;case 'restart':newGame();return;}render()});document.getElementById('reset').addEventListener('click',()=>{if(confirm('Start a new game?'))newGame()});newGame();})();
</script></body></html>
